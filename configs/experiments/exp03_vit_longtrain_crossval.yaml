# ============================================================
# Exp03: ViT + longer training + larger bag
# Changes vs baseline:
#   max_epochs: 32 -> 64
#   patience:   16 -> 24
#   bag_size:  512 -> 1024
#   max_lr: 1e-4 -> 3e-4
# ============================================================

crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp03_vit_longtrain"

  clini_table: "/data3/chensx/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/outputs/features/ourdata_conch1_5"
  slide_table:  "/data3/chensx/outputs/tables/ourdata_slide_table.csv"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

advanced_config:
  seed: 42
  max_epochs: 64
  patience: 24
  batch_size: 64
  bag_size: 1024
  max_lr: 3e-4
  div_factor: 25.0

  model_name: "vit"

  model_params:
    vit:
      dim_model: 512
      dim_feedforward: 512
      n_heads: 8
      n_layers: 2
      dropout: 0.25
      use_alibi: false
