  cache_dir: "/data3/chensx/STAMP/outputs/cache/ourdata_macenko"
  cache_tiles_ext: "jpg"

  tile_size_um: 256.0
  tile_size_px: 224
  brightness_cutoff: 240
  max_workers: 8
