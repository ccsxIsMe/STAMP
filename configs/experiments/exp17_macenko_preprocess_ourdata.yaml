# Macenko-normalized STAMP tile cache.
# Goal: train and test in a more consistent stain space.
# ============================================================

preprocessing:
  output_dir: "/data3/chensx/STAMP/outputs/features/ourdata_conch1_5_macenko"

  wsi_dir: "/data3/chensx/Ourdata/Slides"
