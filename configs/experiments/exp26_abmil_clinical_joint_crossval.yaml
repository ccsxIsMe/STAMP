crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp26_abmil_clinical_joint"

  clini_table: "/data3/chensx/STAMP/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/STAMP/outputs/features/ourdata_conch1_5"
  slide_table: "/data3/chensx/STAMP/outputs/tables/ourdata_slide_table.csv"
  clinical_preset: "tcga_shared"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

advanced_config:
  seed: 42
  max_epochs: 40
  patience: 18
  batch_size: 64
  bag_size: 512
  eval_bag_size: 512
  eval_sample_count: 8
  eval_random_sampling: true
  max_lr: 1e-4
  div_factor: 25.0
  monitor_metric: "validation_auroc"
  monitor_mode: "max"

  model_name: "abmil_clinical"

  model_params:
    abmil_clinical:
      dim_hidden: 256
      dropout: 0.25
      clinical_hidden_dim: 128
      fusion_dropout: 0.25
