# ============================================================
# Exp02: ViT + clinical feature fusion
# Change: add cont_labels and cat_labels from clini_table
# Using only 100%-complete columns shared across both cohorts:
#   - AFP (ng/ml): continuous, key HCC biomarker
#   - 性别: categorical (gender)
#   - 年龄: continuous (age)
# ============================================================

crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp02_vit_clinical"

  clini_table: "/data3/chensx/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/outputs/features/ourdata_conch1_5"
  slide_table:  "/data3/chensx/outputs/tables/ourdata_slide_table.csv"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

  # Clinical feature fusion
  cont_labels:
    - "AFP (ng/ml)"
    - "年龄"
  cat_labels:
    - "性别"

advanced_config:
  seed: 42
  max_epochs: 32
  patience: 16
  batch_size: 64
  bag_size: 512
  max_lr: 1e-4
  div_factor: 25.0

  model_name: "vit"

  model_params:
    vit:
      dim_model: 512
      dim_feedforward: 512
      n_heads: 8
      n_layers: 2
      dropout: 0.25
      use_alibi: false
