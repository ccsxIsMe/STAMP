# ============================================================
# Exp02: ViT + Clinical Feature Post-hoc Ensemble
#
# STAMP does not support clinical feature fusion natively.
# Strategy: train a separate logistic regression on clinical
# features, then ensemble WSI scores + clinical scores.
#
# Step 1: This config trains WSI-only model (same as baseline)
#         but outputs fold predictions for clinical ensemble.
# Step 2: Run scripts/clinical_ensemble.py to add clinical features.
#
# Clinical features used (100% complete in both cohorts):
#   - AFP (ng/ml): continuous
#   - 年龄 (age): continuous
#   - 性别 (sex): categorical
# ============================================================

crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp02_vit_clinical"

  clini_table: "/data3/chensx/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/outputs/features/ourdata_conch1_5"
  slide_table:  "/data3/chensx/outputs/tables/ourdata_slide_table.csv"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

advanced_config:
  seed: 42
  max_epochs: 32
  patience: 16
  batch_size: 64
  bag_size: 512
  max_lr: 1e-4
  div_factor: 25.0

  model_name: "vit"

  model_params:
    vit:
      dim_model: 512
      dim_feedforward: 512
      n_heads: 8
      n_layers: 2
      dropout: 0.25
      use_alibi: false
