# ============================================================
# Exp17 Deploy: evaluate the model trained on Macenko-normalized
# Ourdata features on Macenko-normalized TCGA CONCH1.5 features.
# ============================================================

deployment:
  output_dir: "/data3/chensx/STAMP/outputs/deploy/exp17_macenko"

  clini_table: "/data3/chensx/STAMP/outputs/tables/tcga_clinical_filtered.csv"
  feature_dir: "/data3/chensx/STAMP/outputs/features/tcga_conch1_5_macenko"
  slide_table: "/data3/chensx/STAMP/outputs/tables/tcga_slide_table_macenko.csv"

  ground_truth_label: "Early recurrence"
  patient_label: "PATIENT"
  filename_label: "FILENAME"

  bag_size: 512
  sample_count: 8
  random_sampling: true

  checkpoint_paths:
    - "/data3/chensx/STAMP/outputs/crossval/exp17_macenko/split-0/model.ckpt"
    - "/data3/chensx/STAMP/outputs/crossval/exp17_macenko/split-1/model.ckpt"
    - "/data3/chensx/STAMP/outputs/crossval/exp17_macenko/split-2/model.ckpt"
    - "/data3/chensx/STAMP/outputs/crossval/exp17_macenko/split-3/model.ckpt"
    - "/data3/chensx/STAMP/outputs/crossval/exp17_macenko/split-4/model.ckpt"
