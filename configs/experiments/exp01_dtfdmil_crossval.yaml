# ============================================================
# Exp01: DTFD-MIL
# Goal: perform sub-bag discrimination first, then distill the
# most informative instances for second-stage bag prediction.
# ============================================================

crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp01_dtfdmil"

  clini_table: "/data3/chensx/STAMP/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/STAMP/outputs/features/ourdata_conch1_5"
  slide_table: "/data3/chensx/STAMP/outputs/tables/ourdata_slide_table.csv"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

advanced_config:
  seed: 42
  max_epochs: 32
  patience: 16
  batch_size: 64
  bag_size: 512
  max_lr: 1e-4
  div_factor: 25.0
  use_class_weights: true
  classification_loss: "cross_entropy"
  label_smoothing: 0.0

  model_name: "dtfd_mil"

  model_params:
    dtfd_mil:
      dim_hidden: 512
      dropout: 0.25
      n_groups: 4
      distill_topk: 4
      distill_bottomk: 2
      aux_loss_blend: 0.5
