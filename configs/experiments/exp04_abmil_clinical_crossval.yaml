# ============================================================
# Exp04: TransMIL + clinical ensemble (combination of Exp01 + Exp02)
# Step 1: Run this crossval config (TransMIL WSI model)
# Step 2: Run scripts/clinical_ensemble.py on the predictions
# ============================================================

crossval:
  output_dir: "/data3/chensx/STAMP/outputs/crossval/exp04_abmil_clinical"

  clini_table: "/data3/chensx/STAMP/outputs/tables/ourdata_clinical_merged.csv"
  feature_dir: "/data3/chensx/STAMP/outputs/features/ourdata_conch1_5"
  slide_table:  "/data3/chensx/STAMP/outputs/tables/ourdata_slide_table.csv"

  task: "classification"
  ground_truth_label: "Early recurrence"
  categories: ["0", "1"]
  patient_label: "PATIENT"
  filename_label: "FILENAME"
  n_splits: 5

advanced_config:
  seed: 42
  max_epochs: 32
  patience: 16
  batch_size: 64
  bag_size: 512
  max_lr: 1e-4
  div_factor: 25.0

  model_name: "trans_mil"

  model_params:
    trans_mil:
      dim_hidden: 512
